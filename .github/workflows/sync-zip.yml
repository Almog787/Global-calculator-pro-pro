name: Sync Repo with ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'global-calculator-pro.zip'

permissions:
  contents: write

jobs:
  sync-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Extract and Replace All Files
        run: |
          # 1. יצירת תיקייה זמנית וחילוץ ה-ZIP
          mkdir -p temp_extracted
          unzip -o global-calculator-pro.zip -d temp_extracted/

          # 2. הסרת תיקיית .github מתוך ה-ZIP (למניעת שגיאות הרשאות ב-GitHub Actions)
          rm -rf temp_extracted/.github

          # 3. טיפול במצב שבו הקבצים בתוך ה-ZIP עטופים בתיקייה פנימית (Flattening)
          INSIDE_ITEMS=(temp_extracted/*)
          if [ ${#INSIDE_ITEMS[@]} -eq 1 ] && [ -d "${INSIDE_ITEMS[0]}" ]; then
            mv ${INSIDE_ITEMS[0]}/* temp_extracted/ 2>/dev/null || true
            mv ${INSIDE_ITEMS[0]}/.* temp_extracted/ 2>/dev/null || true
          fi

          # 4. מחיקת כל הקבצים הישנים במאגר (למעט תיקיית .git, .github וקובץ ה-ZIP)
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'global-calculator-pro.zip' \
            ! -name 'temp_extracted' \
            -exec rm -rf {} +

          # 5. העתקת הקבצים החדשים לשורש המאגר וניקוי התיקייה הזמנית
          cp -a temp_extracted/. .
          rm -rf temp_extracted

      - name: Commit and Force Push
        run: |
          # הגדרת משתמש Git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # הוספת כל הקבצים
          git add -A
          
          # ביצוע Commit ו-Push בכוח ללא תנאים
          git commit -m "Replace repository files with global-calculator-pro.zip contents" || echo "No changes"
          git push --force origin main
