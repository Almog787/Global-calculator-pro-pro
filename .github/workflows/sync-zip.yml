name: Sync Repo with ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'global-calculator-pro.zip'

permissions:
  contents: write

jobs:
  sync-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Wipe Existing Files and Unpack ZIP
        run: |
          # 1. Create a temporary folder and extract the ZIP
          mkdir -p temp_extracted
          unzip -o global-calculator-pro.zip -d temp_extracted/

          # 2. Remove .github directory from extracted ZIP if present (prevents permission errors)
          rm -rf temp_extracted/.github

          # 3. Flatten inner directory if ZIP contents are nested inside a single folder
          INSIDE_ITEMS=(temp_extracted/*)
          if [ ${#INSIDE_ITEMS[@]} -eq 1 ] && [ -d "${INSIDE_ITEMS[0]}" ]; then
            mv ${INSIDE_ITEMS[0]}/* temp_extracted/ 2>/dev/null || true
            mv ${INSIDE_ITEMS[0]}/.* temp_extracted/ 2>/dev/null || true
          fi

          # 4. Total deletion: Remove all files and folders in root except .git, .github, and the ZIP
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'global-calculator-pro.zip' \
            ! -name 'temp_extracted' \
            -exec rm -rf {} +

          # 5. Copy extracted files from ZIP into repository root
          cp -a temp_extracted/. .
          rm -rf temp_extracted

          # 6. Generate a timestamp file to guarantee a modified file on every execution
          echo "Last sync execution: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > .sync_timestamp

      - name: Commit and Force Push
        run: |
          # Configure Git bot credentials
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage all changes (deletions, additions, modifications)
          git add -A
          
          # Force commit using --allow-empty to guarantee a new commit on every run
          git commit --allow-empty -m "Replaced repository files with ZIP contents [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
          
          # Force push to origin main
          git push --force origin main
