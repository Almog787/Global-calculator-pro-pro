name: Sync Repo with ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'global-calculator-pro.zip'

permissions:
  contents: write

jobs:
  sync-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Extract and Overwrite Files By Matching Names
        run: |
          # 1. Create a temporary directory and extract the ZIP contents
          mkdir -p temp_extracted
          unzip -o global-calculator-pro.zip -d temp_extracted/

          # 2. Remove .github directory from extracted files to avoid permission conflicts
          rm -rf temp_extracted/.github

          # 3. Flatten directory if files inside ZIP are wrapped in a single root folder
          INSIDE_ITEMS=(temp_extracted/*)
          if [ ${#INSIDE_ITEMS[@]} -eq 1 ] && [ -d "${INSIDE_ITEMS[0]}" ]; then
            mv ${INSIDE_ITEMS[0]}/* temp_extracted/ 2>/dev/null || true
            mv ${INSIDE_ITEMS[0]}/.* temp_extracted/ 2>/dev/null || true
          fi

          # 4. Direct overwrite: Match relative paths and overwrite matching files verbosely (-v)
          echo "=== Replacing files by matching relative paths and names ==="
          cp -rvf temp_extracted/. .

          # 5. Clean up temporary folder
          rm -rf temp_extracted

      - name: Commit and Force Push
        run: |
          # Configure Git identities for Actions bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage all updated files
          git add -A
          
          # Commit and force push changes
          git commit -m "Overwrite matching files from global-calculator-pro.zip" || echo "No file content differences detected by Git"
          git push --force origin main
